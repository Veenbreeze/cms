services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmsa}
      POSTGRES_USER: ${POSTGRES_USER:-cmsa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmsa_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmsa} -d ${POSTGRES_DB:-cmsa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-cmsa_minio_user}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-cmsa_minio_password}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set localminio http://minio:9000 ${AWS_ACCESS_KEY_ID:-cmsa_minio_user} ${AWS_SECRET_ACCESS_KEY:-cmsa_minio_password};
      mc mb --ignore-existing localminio/${AWS_STORAGE_BUCKET_NAME:-cmsa-media};
      mc anonymous set download localminio/${AWS_STORAGE_BUCKET_NAME:-cmsa-media};
      exit 0;
      "

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      AWS_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  backend_media:
  backend_static:
